name: iuna-local-testnet

x-iuna-node: &iuna-node
  build:
    context: .
    dockerfile: Dockerfile.local-testnet
  image: iuna-local-testnet:latest
  init: true
  restart: unless-stopped
  environment:
    IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
    IUNA_INSECURE_OPERATOR_API: "1"
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/status"]
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: iuna-static-site:latest
    init: true
    restart: unless-stopped
    ports:
      - "8080:80"

  bootstrap:
    <<: *iuna-node
    command:
      - --data-dir
      - /data
      - --http
      - 0.0.0.0:8080
      - --p2p
      - 0.0.0.0:19733
      - --wallet-endpoint
      - 0.0.0.0:18662
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:18662:18662"
      - "19733:19733"
    volumes:
      - bootstrap-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.10

  node2:
    <<: *iuna-node
    command:
      - --data-dir
      - /data
      - --http
      - 0.0.0.0:8080
      - --p2p
      - 0.0.0.0:19733
      - --peer
      - 172.28.0.10:19733
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - node2-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.11

networks:
  iuna-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  bootstrap-data:
  node2-data:
