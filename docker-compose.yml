name: iuna-local-testnet

x-iuna-node: &iuna-node
  build:
    context: .
    dockerfile: Dockerfile.local-testnet
  image: iuna-local-testnet:latest
  init: true
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://127.0.0.1:18661/api/auth/status"]
    interval: 10s
    timeout: 3s
    retries: 12
    start_period: 10s

services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    image: iuna-static-site:latest
    init: true
    restart: unless-stopped
    ports:
      - "8080:80"

  bootstrap:
    <<: *iuna-node
    hostname: iuna-bootstrap
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "false"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - if [ -s /data/chain.sqlite3 ]; then exec iuna --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.10:9444 --debug; else exec iuna --genesis --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.10:9444 --debug; fi
    ports:
      - "8661:18661"
      - "19444:9444"
    volumes:
      - bootstrap-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.10

  node2:
    <<: *iuna-node
    hostname: iuna-node2
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "true"
      IUNA_POW_MINING_WORKERS: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec iuna --join 172.28.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.11:9444 --debug
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "8662:18661"
      - "19445:9444"
    volumes:
      - node2-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.11

  node3:
    <<: *iuna-node
    hostname: iuna-node3
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "true"
      IUNA_POW_MINING_WORKERS: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec iuna --join 172.28.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.12:9444 --stratum 0.0.0.0:3333 --debug
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "8663:18661"
      - "19446:9444"
      - "3333:3333"
    volumes:
      - node3-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.12

  node4:
    <<: *iuna-node
    hostname: iuna-node4
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "true"
      IUNA_POW_MINING_WORKERS: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec iuna --join 172.28.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.13:9444 --debug
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "8664:18661"
      - "19447:9444"
    volumes:
      - node4-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.13

  node5:
    <<: *iuna-node
    hostname: iuna-node5
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "true"
      IUNA_POW_MINING_WORKERS: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec iuna --join 172.28.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.14:9444 --debug
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "8665:18661"
      - "19448:9444"
    volumes:
      - node5-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.14

  node6:
    <<: *iuna-node
    hostname: iuna-node6
    environment:
      IUNA_WALLET_PASSWORD: ${IUNA_TESTNET_PASSWORD:-testtesttest}
      IUNA_SETUP_COMPLETE: "true"
      IUNA_LOCAL_TESTNET: "true"
      IUNA_AUTOMATIC_BURN_ENABLED: "true"
      IUNA_POW_MINING_ENABLED: "true"
      IUNA_POW_MINING_WORKERS: "1"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - exec iuna --join 172.28.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.28.0.15:9444 --debug
    depends_on:
      bootstrap:
        condition: service_healthy
    ports:
      - "8666:18661"
      - "19449:9444"
    volumes:
      - node6-data:/data
    networks:
      iuna-testnet:
        ipv4_address: 172.28.0.15

networks:
  iuna-testnet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  bootstrap-data:
  node2-data:
  node3-data:
  node4-data:
  node5-data:
  node6-data:
