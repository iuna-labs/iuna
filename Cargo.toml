[package]
name = "iuna"
version = "0.4.21"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
bip39 = "2.2.2"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
num-bigint = "=0.4.6"
num-integer = "=0.1.46"
num-traits = "0.2.19"
pbkdf2 = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1.45.1", features = ["full"] }
kyn-vdf = "=0.1.1"

[features]
e2e = []
fuzzing = []

[[bin]]
name = "iuna-e2e-checkpoint"
path = "src/bin/iuna-e2e-checkpoint.rs"
required-features = ["e2e"]

[dev-dependencies]
proptest = "1.6.0"
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }

[profile.release]
codegen-units = 1
lto = "thin"
