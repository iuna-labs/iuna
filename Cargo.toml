[package]
name = "iuna"
version = "0.1.10"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1.0.98"
axum = "0.8.4"
chacha20poly1305 = "0.10.1"
ed25519-dalek = "2.2.0"
getrandom = "0.2.17"
pbkdf2 = "0.12.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tokio = { version = "1.45.1", features = ["full"] }

[dev-dependencies]
tempfile = "3.20.0"
tower = { version = "0.5.2", features = ["util"] }
