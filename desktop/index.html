<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iuna</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "JetBrains Mono", "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      /* Same tokens as the node UI in www/node.html. */
      --bg: #121310;
      --line: #2b2e25;
      --muted: #b0aa95;
      --muted-2: #9a9480;
      --text: #e8e2cc;
      --accent: #d5f55f;
      background: var(--bg);
      color: var(--text);
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: var(--bg);
    }

    main {
      width: min(24rem, calc(100vw - 3rem));
      display: grid;
      justify-items: center;
      text-align: center;
    }

    .mark {
      width: 3.5rem;
      height: 3.5rem;
      margin-bottom: 1.5rem;
      display: grid;
      place-items: center;
      color: var(--accent);
    }

    .mark svg {
      width: 3rem;
      height: 3rem;
    }

    .mark-loop {
      fill: none;
      stroke: currentColor;
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mark-dot {
      fill: currentColor;
    }

    h1 {
      margin: 0;
      font-size: 1.375rem;
      font-weight: 650;
      letter-spacing: -0.015em;
    }

    p {
      margin: 0.6rem 0 0;
      color: var(--muted);
      font-size: 0.875rem;
      line-height: 1.55;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 1.75rem;
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 0.45rem 0.9rem;
      color: var(--muted-2);
      font-size: 0.8rem;
    }

    .status::before {
      content: "";
      width: 0.75rem;
      height: 0.75rem;
      flex: 0 0 auto;
      border: 2px solid var(--line);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .status.error {
      border-color: #7a2f26;
      color: #ff8f80;
    }

    .status.error::before {
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .status::before { animation: none; }
    }

  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <circle class="mark-dot" cx="9.4" cy="7.6" r="2.8"></circle>
        <path class="mark-loop" d="M9.4 13v7.1c0 3.7 2.9 6.4 6.6 6.4s6.6-2.7 6.6-6.4V13"></path>
      </svg>
    </div>
    <h1>Starting iuna</h1>
    <p>The local node is starting. The management UI opens here when it is ready.</p>
    <div id="status" class="status">Waiting for http://127.0.0.1:8080</div>
  </main>
  <script>
    const managementUrl = "http://127.0.0.1:8080/";
    const statusEl = document.getElementById("status");
    let attempts = 0;

    // Navigates only when the desktop shell confirms its own node owns the port, so a different
    // server on that port never receives the token or IPC access.
    async function waitForNode() {
      attempts += 1;
      try {
        const token = await window.__TAURI__.core.invoke("desktop_operator_token");
        if (token) {
          window.location.replace(`${managementUrl}#operator-token=${encodeURIComponent(token)}`);
          return;
        }
        statusEl.textContent = `Waiting for ${managementUrl} (${attempts})`;
        window.setTimeout(waitForNode, 300);
      } catch (error) {
        statusEl.classList.add("error");
        statusEl.textContent = `Could not start the local node: ${error}`;
      }
    }

    waitForNode();
  </script>
</body>
</html>
