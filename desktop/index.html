<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>iuna</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101214;
      color: #f4f0e8;
    }

    html {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      width: 100%;
      height: 100%;
      min-height: 100%;
      margin: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 20%, rgba(219, 182, 109, 0.14), transparent 34rem),
        linear-gradient(180deg, #151719 0%, #0d0f10 100%);
    }

    main {
      width: min(26rem, calc(100vw - 3rem));
      text-align: center;
    }

    .mark {
      width: 4.25rem;
      height: 4.25rem;
      margin: 0 auto 1.5rem;
      border-radius: 1.25rem;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #dcb16a, #f4e5bd 48%, #8a5c2f);
      color: #151719;
      font-size: 2rem;
      font-weight: 800;
      box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.28);
    }

    .mark svg {
      width: 2.65rem;
      height: 2.65rem;
    }

    .mark-loop {
      fill: none;
      stroke: currentColor;
      stroke-width: 4.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mark-dot {
      fill: currentColor;
    }

    h1 {
      margin: 0;
      font-size: 1.5rem;
      font-weight: 750;
      letter-spacing: 0;
    }

    p {
      margin: 0.75rem 0 0;
      color: rgba(244, 240, 232, 0.72);
      line-height: 1.55;
    }

    .status {
      margin-top: 1.5rem;
      font-size: 0.86rem;
      color: rgba(244, 240, 232, 0.58);
    }

    button {
      margin-top: 1.25rem;
      border: 1px solid rgba(244, 240, 232, 0.2);
      border-radius: 0.5rem;
      padding: 0.72rem 0.95rem;
      background: rgba(244, 240, 232, 0.08);
      color: #f4f0e8;
      font: inherit;
      cursor: pointer;
    }

    button:hover {
      background: rgba(244, 240, 232, 0.13);
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <circle class="mark-dot" cx="9.4" cy="7.6" r="2.8"></circle>
        <path class="mark-loop" d="M9.4 13v7.1c0 3.7 2.9 6.4 6.6 6.4s6.6-2.7 6.6-6.4V13"></path>
      </svg>
    </div>
    <h1>Starting iuna</h1>
    <p>The local node is starting. The management UI opens here when it is ready.</p>
    <div id="status" class="status">Waiting for http://127.0.0.1:18661</div>
    <button id="open" type="button">Open Management UI</button>
  </main>
  <script>
    const managementUrl = "http://127.0.0.1:18661/";
    const statusEl = document.getElementById("status");
    const openButton = document.getElementById("open");
    let attempts = 0;

    async function waitForNode() {
      attempts += 1;
      try {
        await fetch(managementUrl, { method: "GET", mode: "no-cors", cache: "no-store" });
        window.location.replace(managementUrl);
      } catch (error) {
        statusEl.textContent = `Waiting for ${managementUrl} (${attempts})`;
        window.setTimeout(waitForNode, 700);
      }
    }

    openButton.addEventListener("click", () => {
      window.location.href = managementUrl;
    });

    waitForNode();
  </script>
</body>
</html>
