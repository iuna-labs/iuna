[package]
name = "iuna-fuzz"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
iuna = { path = ".." }
libfuzzer-sys = "0.4"
serde_json = "1"
tempfile = "3"

# Keeps this crate out of the node's dependency graph and lockfile.
[workspace]

[[bin]]
name = "p2p_envelope"
path = "fuzz_targets/p2p_envelope.rs"
test = false
doc = false

[[bin]]
name = "signed_objects"
path = "fuzz_targets/signed_objects.rs"
test = false
doc = false

[[bin]]
name = "wallet_file"
path = "fuzz_targets/wallet_file.rs"
test = false
doc = false
