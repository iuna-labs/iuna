[package]
name = "iuna-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
iuna = { path = "..", default-features = false, features = ["fuzzing"] }
libfuzzer-sys = "0.4"
serde_json = "1"

[[bin]]
name = "p2p_envelope"
path = "fuzz_targets/p2p_envelope.rs"
test = false
doc = false

[[bin]]
name = "compact_snapshot"
path = "fuzz_targets/compact_snapshot.rs"
test = false
doc = false

[[bin]]
name = "domain_json"
path = "fuzz_targets/domain_json.rs"
test = false
doc = false

[[bin]]
name = "stratum_request"
path = "fuzz_targets/stratum_request.rs"
test = false
doc = false

[[bin]]
name = "wallet_config"
path = "fuzz_targets/wallet_config.rs"
test = false
doc = false

[[bin]]
name = "vdf_proof"
path = "fuzz_targets/vdf_proof.rs"
test = false
doc = false

[[bin]]
name = "transaction_v2"
path = "fuzz_targets/transaction_v2.rs"
test = false
doc = false
