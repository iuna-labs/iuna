    command:
      - exec iuna --join 172.29.0.10:9444 --data-dir /data --http 0.0.0.0:18661 --p2p 0.0.0.0:9444 --p2p-announce 172.29.0.14:9444 --debug
    healthcheck:
      interval: 1s
      retries: 900
      start_period: 2s
    ports: !override
