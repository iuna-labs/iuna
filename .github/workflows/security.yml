name: Security and desktop builds

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Install pinned cargo-audit
        run: cargo +1.88.0 install cargo-audit --version 0.22.1 --locked
      - name: Audit dependencies and enforce source/license policy
        run: ./scripts/check-dependencies.sh
      - name: Test node
        run: cargo test --locked
      - name: Check fuzz targets
        run: cargo check --locked --manifest-path fuzz/Cargo.toml

  desktop-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build host sidecar
        run: |
          cargo +1.88.0 build --locked
          target_triple="$(rustc +1.88.0 -vV | sed -n 's/^host: //p')"
          mkdir -p src-tauri/binaries
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/debug/iuna.exe "src-tauri/binaries/iuna-sidecar-${target_triple}.exe"
          else
            cp target/debug/iuna "src-tauri/binaries/iuna-sidecar-${target_triple}"
          fi
      - name: Test desktop crate
        run: cargo +1.88.0 test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build desktop crate
        run: cargo +1.88.0 build --locked --manifest-path src-tauri/Cargo.toml
