[package]
name = "iuna-desktop"
version = "0.4.70"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["native-tls"] }
