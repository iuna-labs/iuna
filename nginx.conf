server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /wallet {
        return 301 https://wallet.getiuna.org/;
    }

    location /wallet/ {
        rewrite ^/wallet/(.*)$ https://wallet.getiuna.org/$1 permanent;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /downloads/latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    location /git/ {
        try_files $uri $uri/ =404;
    }
}

server {
    listen 80;
    server_name wallet.getiuna.org;

    root /usr/share/nginx/html/wallet;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
