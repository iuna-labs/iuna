server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /downloads/latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    location /git/ {
        try_files $uri $uri/ =404;
    }
}
