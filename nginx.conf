server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # The getting started guide was removed; links to it land on the homepage.
    location ~ ^/getting-started/?$ {
        # TLS ends at the ingress, so an absolute redirect here would point at http://.
        absolute_redirect off;
        return 301 /;
    }

    location = /downloads/latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /downloads/desktop/latest.json {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location /downloads/ {
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # The wallet keeps its encrypted seed in origin storage, so it must never share
    # an origin with pages that load third-party analytics. Public hosts go to the
    # dedicated wallet origin; other hosts (local Compose) get the wallet CSP.
    location /wallet/ {
        if ($host ~* "(^|\.)getiuna\.(com|org)$") {
            return 301 https://wallet.getiuna.org/;
        }
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:18662; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        # Asset names are unhashed, and the wallet embeds the network's genesis hash: a stale copy
        # signs for the wrong chain. ETag keeps unchanged files a 304.
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /wallet/index.html;
    }

    # Served by the node binary itself; not a website page.
    location = /node.html {
        return 404;
    }
}

server {
    listen 80;
    server_name wallet.getiuna.org;

    root /usr/share/nginx/html/wallet;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http://127.0.0.1:18662; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    # Asset names are unhashed, and the wallet embeds the network's genesis hash: a stale copy signs
    # for the wrong chain. ETag keeps unchanged files a 304.
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
