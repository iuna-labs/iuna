[package]
name = "iuna-wallet-crypto"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"
description = "Deterministic hybrid wallet cryptography for the iuna browser wallet"
repository = "https://github.com/jhartog/iuna"

[lib]
crate-type = ["cdylib"]

[dependencies]
ed25519-dalek = "2.2.0"
ml-dsa = { version = "=0.1.1", default-features = false, features = ["alloc"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"
wasm-bindgen = "=0.2.121"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
